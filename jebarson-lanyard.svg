<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 430">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#7ee787"/>
    </linearGradient>
    <clipPath id="avatar-clip">
      <circle cx="160" cy="180" r="50"/>
    </clipPath>
  </defs>

  <!-- Lanyard strap -->
  <g>
    <!-- Strap -->
    <rect x="145" y="0" width="30" height="75" rx="3" fill="#58a6ff" opacity="0.8"/>
    <rect x="148" y="0" width="24" height="75" rx="2" fill="#1f6feb"/>
    <!-- Clip -->
    <rect x="152" y="65" width="16" height="12" rx="2" fill="#8b949e"/>
    <rect x="155" y="72" width="10" height="8" rx="1" fill="#6e7681"/>
  </g>

  <!-- Card body with swing animation -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="rotate" values="-3,160,77;3,160,77;-3,160,77" dur="4s" repeatCount="indefinite"/>

    <!-- Card background -->
    <rect x="30" y="80" width="260" height="340" rx="16" fill="url(#card-bg)"/>

    <!-- Card border glow -->
    <rect x="30" y="80" width="260" height="340" rx="16" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Header stripe -->
    <rect x="30" y="80" width="260" height="60" rx="16" fill="#58a6ff" opacity="0.15"/>
    <rect x="30" y="120" width="260" height="20" fill="#58a6ff" opacity="0.15"/>

    <!-- DEVELOPER text -->
    <text x="160" y="115" text-anchor="middle" font-family="monospace" font-size="11" fill="#58a6ff" letter-spacing="5" font-weight="bold">DEVELOPER</text>

    <!-- Avatar circle -->
    <circle cx="160" cy="185" r="52" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="185" r="48" fill="#0d1117"/>
    <!-- Avatar placeholder with initials -->
    <text x="160" y="195" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="bold" fill="#58a6ff">J</text>

    <!-- Name -->
    <text x="160" y="260" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#e6edf3">Jebarson</text>

    <!-- Role -->
    <text x="160" y="282" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#58a6ff">Full Stack Developer</text>

    <!-- Divider -->
    <line x1="70" y1="298" x2="250" y2="298" stroke="#30363d" stroke-width="1"/>

    <!-- GitHub handle -->
    <text x="160" y="320" text-anchor="middle" font-family="monospace" font-size="12" fill="#7ee787">@Jebarson-10</text>

    <!-- Tech badges -->
    <g transform="translate(160, 350)">
      <rect x="-95" y="-10" width="42" height="20" rx="10" fill="#58a6ff" opacity="0.2"/>
      <text x="-74" y="4" text-anchor="middle" font-family="monospace" font-size="9" fill="#58a6ff">React</text>

      <rect x="-45" y="-10" width="42" height="20" rx="10" fill="#7ee787" opacity="0.2"/>
      <text x="-24" y="4" text-anchor="middle" font-family="monospace" font-size="9" fill="#7ee787">Node</text>

      <rect x="5" y="-10" width="42" height="20" rx="10" fill="#ffa657" opacity="0.2"/>
      <text x="26" y="4" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffa657">Python</text>

      <rect x="55" y="-10" width="42" height="20" rx="10" fill="#d2a8ff" opacity="0.2"/>
      <text x="76" y="4" text-anchor="middle" font-family="monospace" font-size="9" fill="#d2a8ff">Java</text>
    </g>

    <!-- Status indicator -->
    <circle cx="75" cy="390" r="4" fill="#7ee787">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="87" y="394" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8b949e">Available for hire</text>
  </g>
</svg>
