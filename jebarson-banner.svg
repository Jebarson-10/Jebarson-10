<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300">
  <defs>
    <!-- Gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Neon glow for text -->
    <filter id="neon">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#58a6ff" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bg)" rx="15"/>

  <!-- Animated grid lines -->
  <g opacity="0.08">
    <line x1="0" y1="50" x2="900" y2="50" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="900" y2="100" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="900" y2="150" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="900" y2="250" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
  </g>

  <!-- Floating particles -->
  <circle cx="80" cy="60" r="2" fill="#58a6ff" opacity="0.6">
    <animate attributeName="cy" values="60;40;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="230" r="1.5" fill="#79c0ff" opacity="0.5">
    <animate attributeName="cy" values="230;210;230" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="80" r="2.5" fill="#7ee787" opacity="0.4">
    <animate attributeName="cy" values="80;55;80" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="240" r="1.8" fill="#d2a8ff" opacity="0.5">
    <animate attributeName="cy" values="240;220;240" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="45" r="1.2" fill="#ff7b72" opacity="0.5">
    <animate attributeName="cy" values="45;30;45" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="260" r="2" fill="#ffa657" opacity="0.4">
    <animate attributeName="cy" values="260;240;260" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="150" r="1.5" fill="#58a6ff" opacity="0.6">
    <animate attributeName="cy" values="150;130;150" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="170" r="1" fill="#7ee787" opacity="0.7">
    <animate attributeName="cy" values="170;155;170" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Code bracket decorations -->
  <text x="50" y="150" font-family="monospace" font-size="60" fill="#58a6ff" opacity="0.15" filter="url(#glow)">
    {
    <animate attributeName="opacity" values="0.15;0.25;0.15" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="820" y="150" font-family="monospace" font-size="60" fill="#58a6ff" opacity="0.15" filter="url(#glow)">
    }
    <animate attributeName="opacity" values="0.15;0.25;0.15" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Main heading with typing animation -->
  <text x="450" y="100" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="bold" fill="#e6edf3" filter="url(#neon)">
    Hi, I'm Jebarson 👋
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <!-- Subtitle with gradient -->
  <text x="450" y="145" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#58a6ff">
    ⚡ Full Stack Developer ⚡
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
  </text>

  <!-- Tech stack with wave animation -->
  <g>
    <text x="450" y="190" text-anchor="middle" font-family="monospace" font-size="14" fill="#7ee787" opacity="0.9">
      JavaScript • React • Node.js • Python • TypeScript • Next.js • SQL • Java
      <animate attributeName="opacity" values="0;0.9" dur="2s" fill="freeze"/>
    </text>
  </g>

  <!-- Animated underline -->
  <line x1="180" y1="200" x2="720" y2="200" stroke="url(#line-grad)" stroke-width="2" opacity="0.6">
    <animate attributeName="x1" values="450;180" dur="1.5s" fill="freeze"/>
    <animate attributeName="x2" values="450;720" dur="1.5s" fill="freeze"/>
  </line>
  <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0"/>
    <stop offset="50%" style="stop-color:#58a6ff;stop-opacity:1"/>
    <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0"/>
  </linearGradient>

  <!-- Tagline -->
  <text x="450" y="240" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8b949e" font-style="italic">
    "Building the future, one commit at a time 🚀"
    <animate attributeName="opacity" values="0;1" dur="2.5s" fill="freeze"/>
  </text>

  <!-- Animated cursor blink -->
  <rect x="730" y="225" width="2" height="18" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtle border glow -->
  <rect width="900" height="300" fill="none" stroke="#58a6ff" stroke-width="1" rx="15" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
